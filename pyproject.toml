[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eftx-tilt"
version = "1.1.0"
description = "Bancada EFTX de tilt elétrico, cabos coaxiais e linhas rígidas"
requires-python = ">=3.11"
dependencies = ["PySide6==6.11.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[project.gui-scripts]
eftx-tilt = "tilt.__main__:main"

[tool.setuptools.packages.find]
include = ["tilt*"]

[tool.setuptools.package-data]
tilt = ["assets/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
